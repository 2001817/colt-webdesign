<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stuffs</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!--cookie clicker-->

    <button id="clicker">
        monies: 0
    </button>

    <button id="upg">
        +1 cash per click for 1 money
    </button>

    <script>
        // heard about this thing called BigInt after some guy made infinite chess
        // n at the end turns the int to bigint (no bit limit integer)
        //
        let cash = 0;
        const button = document.getElementById("clicker")

        // future proof
        // just incase new features are added
        // big int is just incase it gets into the billions
        let mult = 1; let add = 1; let exp = 1;
        let price1 = 1;

        // don't use ^ for exponent, also the 1 + add screws stuff up because it isn't BigInt
        let earn = ((mult * add)** exp);
        button.addEventListener("click", function(){
            cash += earn;
            document.getElementById("clicker").innerHTML = "monies: " + String(cash);
        });

        // took me unbelievably long to realise that it's trying to call a function that hasn't been definined yet...
        //document.getElementById("upg").addEventListener("click", buy("upg", price1, 1, 1.1));

        //use for every upgrade button, so make it flexible
        function buy(ID, price, addition, power){
            // price will eventually get too expensive to buy
             if (price <= cash){
                
                cash -= price;
                add += 1;

                // this does not update the given price for some reason
                // even if you break it down into segments
                price = (price + addition) ** power;
                price = Math.round(price);

                

                document.getElementById(ID).innerHTML = "+1 cash per click for " + String(price) + " monies";
                button.innerHTML = "monies: " + String(cash);

                console.log("bought");

                // for some reason variables made out of variables never update, ever. so gonna do that manually now
                earn = ((mult * add) ** exp);
                // NOPE< still doesn't work

                // ok ok so the price variable is updated but not the var inside it (price1, price2, etc).
                return price;
            }
        };

        document.getElementById("upg").addEventListener("click", buy("upg", price1, 1, 1.1));

    </script>

    <br>
    <a href="../../index.html">back to the lobby</a>
</body>



</html>
